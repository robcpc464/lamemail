[package]
name = "lamemail"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
description = "Mirrors IMAP mailboxes into plain JSON text files"
license = "GPL-3.0-or-later"
repository = "https://github.com/robcpc464/lamemail"
publish = false

[dependencies]
anyhow = "1"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
html5gum = { version = "0.8", default-features = false }
jiff = "0.2"
mail-builder = { version = "1", default-features = false }
mail-parser = { version = "0.11", features = ["full_encoding"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[profile.release]
strip = true
lto = true
